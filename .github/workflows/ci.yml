name: pipeline-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Test Python ingestion logic
        run: pytest
      - name: Load deterministic CI fixture
        run: python scripts/load_ci_fixture.py
      - name: Build and test dbt models
        run: dbt build --project-dir dbt --profiles-dir dbt_profiles
