[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-data-pipeline"
version = "0.1.0"
description = "An incremental Crossref-to-DuckDB analytics pipeline for AI research trends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
  "dbt-duckdb>=1.9,<2.0",
  "pytest>=8.3,<10.0",
]

[project.scripts]
ai-research-pipeline = "ai_research_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
